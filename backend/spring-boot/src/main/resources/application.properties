# Snapshot storage (local filesystem MVP)
# Use an absolute path in production; relative paths are resolved against the working directory.
app.snapshot.storage-root=${SNAPSHOT_STORAGE_ROOT:storage/snapshots}

# Phase 3 Part 2: optionally launch Node snapshot worker from backend
app.snapshot.worker.enabled=${SNAPSHOT_WORKER_ENABLED:true}
app.snapshot.worker.node-command=${SNAPSHOT_WORKER_NODE:node}
app.snapshot.worker.working-dir=${SNAPSHOT_WORKER_DIR:/Users/alvinliu/Documents/read-it-later/snapshot-worker}
