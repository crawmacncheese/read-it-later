$kind: http-request
url: "{{baseUrl}}/api/v1/bookmarks/{{bookmarkId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404', function () {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 6000
