$kind: http-request
url: "{{baseUrl}}/api/v1/bookmarks/{{bookmarkId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 204', function () {
        pm.response.to.have.status(204);
      });
    language: text/javascript
order: 5000
